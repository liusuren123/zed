name: Build custom-for-cn-user

on:
  push:
    branches:
      - custom-for-cn-user
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-for-cn-user

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libfontconfig-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxft-dev \
            libxext-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libexpat1-dev \
            libssl-dev \
            libdbus-1-dev \
            cmake \
            llvm-dev \
            libclang-dev \
            clang \
            lld \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libpulse-dev \
            libzstd-dev \
            gettext-base \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rust-src, clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/Python /usr/share/swift
          df -h / | tail -1

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.2 --locked

      - name: Build bundle
        run: script/bundle-linux
        timeout-minutes: 180

      - uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64-${{ github.sha }}
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: zed-remote-server-linux-x86_64-${{ github.sha }}
          path: target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

      - uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          allowUpdates: true
          artifactErrorsFailBuild: false
          artifacts: |
            target/release/zed-linux-x86_64.tar.gz
            target/zed-remote-server-linux-x86_64.gz
          omitBody: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          tag: nightly-custom-for-cn-user
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HOME: C:\cargo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-for-cn-user

      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rust-src, clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-about
        shell: pwsh
        run: cargo install cargo-about --version 0.8.2 --locked

      - name: Detect VS install location
        # Use vswhere to discover the Visual Studio install path on whichever
        # runner image is current (Windows 2022 + VS 2022, or Windows 2025 +
        # VS 2026). Export the result so the bundle script picks it up.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
              Write-Host "vswhere missing at $vswhere"
              exit 1
          }
          $installPath = & $vswhere -latest -property installationPath
          if (-not $installPath) {
              Write-Host "vswhere returned no installationPath"
              exit 1
          }
          Write-Host "Detected VS install: $installPath"
          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build bundle
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
        timeout-minutes: 180

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-x86_64-${{ github.sha }}
          path: target/Zed-x86_64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: zed-remote-server-windows-x86_64-${{ github.sha }}
          path: target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error

      - uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          allowUpdates: true
          artifactErrorsFailBuild: false
          artifacts: |
            target/Zed-x86_64.exe
            target/zed-remote-server-windows-x86_64.zip
          omitBody: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          tag: nightly-custom-for-cn-user
          token: ${{ secrets.GITHUB_TOKEN }}
