name: Build custom-for-cn-user

on:
  push:
    branches:
      - custom-for-cn-user
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-for-cn-user

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libfontconfig-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxft-dev \
            libxext-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libexpat1-dev \
            libssl-dev \
            libdbus-1-dev \
            cmake \
            llvm-dev \
            libclang-dev \
            clang \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libpulse-dev \
            libzstd-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rust-src, clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/Python /usr/share/swift
          df -h / | tail -1

      - name: Build Release
        run: cargo build --release --package zed
        timeout-minutes: 120

      - name: Package binary
        run: |
          strip target/release/zed
          cp target/release/zed zed
          tar czf zed-linux-x64.tar.gz zed
          ls -lh zed-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x64-${{ github.sha }}
          path: zed-linux-x64.tar.gz
          if-no-files-found: error

      - uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          allowUpdates: true
          artifactErrorsFailBuild: false
          artifacts: "zed-linux-x64.tar.gz"
          omitBody: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          tag: nightly-custom-for-cn-user
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-for-cn-user

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rust-src, clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release
        run: cargo build --release --package zed
        timeout-minutes: 120

      - name: Package binary
        run: |
          cd target/release
          cp zed.exe ${{ github.workspace }}\zed.exe
          cd ${{ github.workspace }}
          7z a -tzip zed-windows-x64.zip zed.exe
          del zed.exe
          dir zed-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x64-${{ github.sha }}
          path: zed-windows-x64.zip
          if-no-files-found: error

      - uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          allowUpdates: true
          artifactErrorsFailBuild: false
          artifacts: "zed-windows-x64.zip"
          omitBody: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          tag: nightly-custom-for-cn-user
          token: ${{ secrets.GITHUB_TOKEN }}
