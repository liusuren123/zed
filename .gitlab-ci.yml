# GitLab CI for Zed editor (custom-for-cn-user branch)
# Builds the project and publishes the binary as an artifact.

image: rust:latest

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Zed specific
  CI: "true"
  CI_ENABLED: "true"

stages:
  - build
  - test
  - deploy

cache:
  paths:
    - .cargo/
    - target/

before_script:
  - apt-get update -qq
  # Install Zed's Linux dependencies (fontconfig, x11, wayland, etc.)
  - apt-get install -y -qq \
    pkg-config \
    libfontconfig-dev \
    libfreetype6-dev \
    libx11-dev \
    libxft-dev \
    libxext-dev \
    libxkbcommon-dev \
    libwayland-dev \
    libasound2-dev \
    libexpat1-dev \
    libssl-dev \
    libdbus-1-dev \
    cmake \
    ninja-build \
    llvm-dev \
    libclang-dev \
    clang \
    libc++-dev \
    libc++abi-dev \
    libxcursor-dev \
    libxrandr-dev \
    libxinerama-dev \
    libxi-dev \
    libxfixes-dev \
    libgl1-mesa-dev \
    libglu1-mesa-dev \
    libgtk-3-dev \
    libpango1.0-dev \
    libcairo2-dev \
    libatk1.0-dev \
    libgdk-pixbuf-2.0-dev \
    libsoup2.4-dev \
    libjavascriptcoregtk-4.0-dev \
    libwebkit2gtk-4.0-dev \
    libvlc-dev \
    libvlccore-dev \
    libpulse-dev \
    libzstd-dev \
    zip \
    unzip
  # Use the Rust channel specified in rust-toolchain.toml
  - rustup default 1.95.0
  - rustup component add rust-src clippy rustfmt

build:release:
  stage: build
  script:
    - cargo build --release --package zed
  artifacts:
    name: "zed-${CI_COMMIT_REF_NAME}-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/zed
      - target/release/zed_server
    expire_in: 30 days
  only:
    - custom-for-cn-user
  tags:
    - rust
    - linux

build:check:
  stage: build
  script:
    - cargo check --workspace --lib
  only:
    - custom-for-cn-user
  tags:
    - rust
    - linux

test:fast:
  stage: test
  script:
    - cargo test --lib -p language_model -p agent -p agent_ui -- --skip integration
  needs: ["build:check"]
  only:
    - custom-for-cn-user
  tags:
    - rust
    - linux

# Windows build (requires a Windows GitLab runner)
.windows_build:
  stage: build
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - echo "Building on Windows requires Visual Studio Build Tools and Windows SDK"
    - echo "Install Rust from rustup.rs first"
    - rustup default nightly-2024-11-07
    - rustup component add rust-src rustc-dev llvm-tools-preview
  script:
    - cargo build --release --package zed
  artifacts:
    name: "zed-${CI_COMMIT_REF_NAME}-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/zed.exe
    expire_in: 30 days
  only:
    - custom-for-cn-user
  tags:
    - windows
    - rust

# Publish release when tagged
release:
  stage: deploy
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}..."
    - 'curl --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
      --request POST \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
      --data "{\"name\":\"${CI_COMMIT_TAG}\",\"tag_name\":\"${CI_COMMIT_TAG}\",\"description\":\"Zed build ${CI_COMMIT_TAG}\"}"'
  only:
    - tags
  tags:
    - rust
    - linux
